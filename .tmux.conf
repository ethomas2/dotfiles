#set -g terminal-overrides 'xterm*:smcup@:rmcup@'
set -g mouse on

# set-option -g mouse-select-pane on
# set-option -g mouse-select-window on
# set-window-option -g mode-mouse on

# Don't forget to set iTerm2 setting so tmux can copy to clipboard
# https://apple.stackexchange.com/a/248828
# For version 2.4  and above
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle


unbind C-b
set -g prefix C-Space


unbind Left
unbind Down
unbind Up
unbind Right

unbind "C-Left"
unbind "C-Down"
unbind "C-Up"
unbind "C-Right"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# https://unix.stackexchange.com/a/118381
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# reset tmux working directory
# bind r attach -c "#{pane_current_path}"

# Reorder tmux panes:
# https://superuser.com/questions/343572/how-do-i-reorder-tmux-windows
# something wierd happens here and tmux errors. Any commands placed after these
# don't get read
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1


bind 1 select-layout even-horizontal
bind 2 select-layout even-vertical
bind u select-layout -o

# Disable default layout-switching bindings (easy to trigger accidentally)
unbind Space
unbind M-1
unbind M-2
unbind M-3
unbind M-4
unbind M-5
unbind M-6
unbind M-7
unbind M-8
unbind M-9


bind Up resize-pane -U 10
bind Down resize-pane -D 10
bind Left resize-pane -L 10
bind Right resize-pane -R 10

set-option -g default-shell /bin/bash

# run-shell ~/scrap/tmux-logging/logging.tmux
set-option -g default-shell /bin/bash

# Plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'

# tmux-fzf: launch with prefix + f (override default find-window)
unbind f
TMUX_FZF_LAUNCH_KEY="f"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# Show pane numbers for 3 seconds instead of the default (1 second)
set-option -g display-panes-time 3000


set -g pane-border-status top

set -g history-limit 5000

###############################################################################
################################# claude stuff ################################
###############################################################################

# Per-pane "unread" tracking via tm-watch.
# A pane is unread iff @last_output > @last_viewed.

set -g focus-events on
set -g pane-border-status top

# Visual indicator: borders + label react to per-pane @last_output > @last_viewed
set -g pane-border-format '#{?#{e|>:#{@last_output},#{@last_viewed}},#[fg=yellow]● UNREAD #[default],}#{pane_index} #{pane_current_command}'
set -g pane-border-style '#{?#{e|>:#{@last_output},#{@last_viewed}},fg=yellow,fg=default}'
set -g pane-active-border-style '#{?#{e|>:#{@last_output},#{@last_viewed}},fg=yellow,fg=blue}'

# Hooks: every new pane gets piped; every focus stamps last_viewed
set-hook -g after-split-window 'run-shell "/Users/evanthomas/scripts/tm-watch on-create #{pane_id}"'
set-hook -g after-new-window   'run-shell "/Users/evanthomas/scripts/tm-watch on-create #{pane_id}"'
set-hook -g after-new-session  'run-shell "/Users/evanthomas/scripts/tm-watch on-create #{pane_id}"'
set-hook -g pane-focus-in      'run-shell "/Users/evanthomas/scripts/tm-watch on-focus #{pane_id}"'

# Bootstrap existing panes (re-source-safe; on-create checks pane_pipe and skips if already piped)
run-shell '/Users/evanthomas/scripts/tm-watch bootstrap'

# prefix + D : popup list of unread panes
bind D display-popup -E -w 80% -h 60% '/Users/evanthomas/scripts/tm-watch list ; printf "\nPress any key..." ; read -rsn 1'

###############################################################################
############################### end claude stuff ##############################
###############################################################################
